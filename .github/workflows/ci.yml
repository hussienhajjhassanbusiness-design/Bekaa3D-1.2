name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run still testing the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Depth 2: a PR checks out its merge commit, whose first parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Tests are skipped only for a PR touching nothing but docs/** and *.md;
      # the OpenAPI snapshot is checked by tests, so it still counts as code.
      - name: Detect code changes
        id: filter
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ]; then
              code=false
              while IFS= read -r path; do
                case "$path" in
                  docs/frontend-handoff/openapi.json) code=true ;;
                  docs/*|*.md) ;;
                  *) code=true ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Run tests: $code"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Exact, hash-checked versions from the lock (CONTRIBUTING.md
      # "Dependencies"); the project itself is installed without resolving
      # anything further.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Balanced by measured run time. The last two shards are "everything
      # else", so a new test directory can never fall out of CI.
      matrix:
        include:
          - shard: unit
            paths: tests/unit
          - shard: integration-ordering
            paths: tests/integration/ordering
          - shard: integration-identity
            paths: tests/integration/identity
          - shard: integration-payments-platform
            paths: tests/integration/payments tests/integration/platform
          - shard: integration-catalog-fulfillment
            paths: tests/integration/catalog tests/integration/fulfillment
          - shard: integration-rest
            paths: >-
              tests/integration
              --ignore=tests/integration/ordering
              --ignore=tests/integration/identity
              --ignore=tests/integration/payments
              --ignore=tests/integration/platform
              --ignore=tests/integration/catalog
              --ignore=tests/integration/fulfillment
          - shard: concurrency-security-e2e-smoke
            paths: tests --ignore=tests/unit --ignore=tests/integration
    name: test (${{ matrix.shard }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Prepare test environment file
        run: cp .env.example .env

      # Each runner starts its own Postgres and Redis through testcontainers
      # (tests/conftest.py), so shards share no database state.
      - name: Pytest
        run: pytest ${{ matrix.paths }}

  # The one check that says the PR is green: every job passed, or tests were
  # skipped because the PR changed only docs.
  ci-ok:
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }} code=${{ needs.changes.outputs.code }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          [ "${{ needs.lint.result }}" = success ] || exit 1
          case "${{ needs.test.result }}" in
            success) ;;
            skipped) [ "${{ needs.changes.outputs.code }}" = false ] || exit 1 ;;
            *) exit 1 ;;
          esac
