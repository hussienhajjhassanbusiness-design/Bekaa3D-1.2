# nginx is deliberately omitted until the protected-download (STL entitlement) slice
# lands - see docs/adr for the X-Accel-Redirect design.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      # Host 5432 is taken by a native Windows PostgreSQL service (postgres.exe),
      # not a Docker container; mapped to 5442 here until that's resolved.
      # Change back to "5432:5432" once that service is stopped or reconfigured.
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_defs:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s # first boot downloads virus definitions

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--app-dir",
        "src",
        "--reload",
      ]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./storage/stl_private:/data/stl_private
      - ./storage/uploads_private:/data/uploads_private
      - ./storage/media_public:/data/media_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local development only: serves storage/media_public (product images, the
  # homepage hero image) read-only at http://localhost:8001, which is where the
  # frontend's dev `/media/*` rewrite points (MEDIA_PROXY_TARGET). The API does
  # not serve /media itself; in production the web server serves the same
  # root-relative /media/... URLs. It runs the api service's image (built by
  # `docker compose up`), so nothing extra is built or pulled.
  media:
    image: bekaa3d-backend-api
    pull_policy: never
    depends_on:
      - api
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8001", "--bind", "0.0.0.0", "--directory", "/data/media_public"]
    # The image's HEALTHCHECK probes the API on :8000, which this container does not run.
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./storage/media_public:/data/media_public:ro

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app/src
    # Deliberately NOT `arq ... --watch`: arq's watch mode never awaits the
    # worker task, so a Redis blip kills the poll loop while the process stays
    # alive and every email in the system silently stops. `python -m app.worker`
    # exits non-zero instead, and `restart: unless-stopped` brings it back.
    # Trade-off: worker code changes need `docker compose restart worker`.
    command: ["python", "-m", "app.worker"]
    healthcheck:
      # arq's own check: reads the heartbeat the worker writes to Redis each
      # poll and fails if it has gone stale, so a stalled-but-running worker
      # shows as unhealthy instead of looking fine. Run through
      # app.worker_health rather than `arq app.worker.WorkerSettings --check`:
      # that imports the whole app, which over the ./src bind mount on a
      # Windows host takes longer than the timeout, so the probe always failed.
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./src:/app/src
      # reap_orphan_files (VS-014) reconciles this directory against product_images.
      - ./storage/media_public:/data/media_public
      # purge_expired_attachments and reap_orphan_files (VS-034) work on BYI attachments.
      - ./storage/uploads_private:/data/uploads_private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  clamav_defs:
