[project]
name = "bekaa3d"
version = "0.1.0"
description = "Bekaa3D - dual-commerce platform (physical catalogue + STL marketplace)"
requires-python = ">=3.13"
# Ranges say what the code is known to work with: each floor is the version
# the suite was last run against (the code relies on recent features, e.g.
# FastAPI's `Depends(scope=...)` for BUG-46), each ceiling the next major where
# the project follows semver. The exact, hash-pinned versions every install
# actually uses live in requirements.txt / requirements-dev.txt - see
# CONTRIBUTING.md "Dependencies".
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15,<3",
    "pyotp>=2.10,<3",
    "cryptography>=50",
    "redis>=5.3,<6",
    "arq>=0.28,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.32,<0.1",
    "structlog>=26.1",
    "jinja2>=3.1,<4",
    "email-validator>=2.3,<3",
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    # 0.x: formatting and rule sets change between minors, so stay on this one.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "testcontainers[postgres,redis]>=4.13,<5",
    "faker>=40.0",
    # Deep edge-case suites (tests/**/test_deep_*.py): property-based tests and
    # frozen-clock time-boundary tests.
    "hypothesis>=6.168,<7",
    "time-machine>=3.5,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures (db_engine) share connections across tests;
# those connections are bound to the event loop they were opened on, so the
# loop itself must also be session-scoped or asyncpg breaks on Windows.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Timing-oracle tests compare wall-clock latency between branches and are
# machine-sensitive, so they are excluded by default and in CI. Run them
# manually with `pytest -m timing` (see CONTRIBUTING.md); a later -m wins.
addopts = "-ra --strict-markers -m 'not timing'"
markers = [
    "integration: requires a live Postgres",
    "concurrency: exercises race conditions",
    "timing: wall-clock timing-oracle tests; excluded by default, run with -m timing",
    "smoke: fast must-work checks per slice; run alone with -m smoke (see tests/smoke/)",
    "clamav: needs a reachable clamd (docker compose); skipped when none answers",
]

[tool.coverage.run]
# SQLAlchemy's async layer runs database code inside greenlets; without the
# greenlet tracer coverage misses every line after the first await into it.
concurrency = ["greenlet", "thread"]
branch = true
source = ["app"]
