</div>

<div class="space-y-2">

<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">
                            mail
                        </span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline-variant/60" id="email" name="email" placeholder="engineer@bekaa3d.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block ml-1 uppercase" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">
                            lock
                        </span>

<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->

<label class="flex items-center space-x-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" type="checkbox"/>
<span class="text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-primary hover:text-on-primary-fixed-variant font-medium transition-colors hover:underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full brand-gradient text-on-primary font-label-caps text-label-caps py-4 rounded-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all duration-200 uppercase tracking-widest font-bold" type="submit">
                    Login to Dashboard

<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-caps text-[10px] text-outline-variant uppercase">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>

</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Add focus effects for a more premium feel
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').style.color = '#0d631b';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').style.color = '';
            });
        });
    </script>
