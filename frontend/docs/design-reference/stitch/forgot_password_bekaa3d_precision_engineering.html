<!-- Micro-interaction Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('.blueprint-bg');
            if(bg) {
                const moveX = (e.clientX / window.innerWidth) * 10;
                const moveY = (e.clientY / window.innerHeight) * 10;
                bg.style.backgroundPosition = `${moveX}px ${moveY}px`;
            }
        });

        // Simple form interaction
        const emailInput = document.getElementById('email');
        const submitBtn = document.querySelector('button[type="submit"]');

        emailInput.addEventListener('input', (e) => {
            if(e.target.value.includes('@') && e.target.value.length > 5) {
                submitBtn.classList.add('shadow-[0_0_20px_rgba(13,99,27,0.3)]');
            } else {
                submitBtn.classList.remove('shadow-[0_0_20px_rgba(13,99,27,0.3)]');
            }
        });
    </script>
